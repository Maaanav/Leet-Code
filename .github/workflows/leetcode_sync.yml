
      - name: Commit and push changes
        run: |
          git config user.name "Maaanav"
          git config user.email "41898282+Maaanav@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync LeetCode submission"

          # Retry if main changes while we are pushing
          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict. Stopping safely."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "LeetCode solutions pushed successfully."
              exit 0
            fi

            echo "Push failed on attempt $attempt."
            sleep 2
          done

          echo "Push failed after 3 attempts."
          exit 1
