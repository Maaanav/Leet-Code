
name: Sync LeetCode Submissions

on:
  workflow_dispatch:

  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

concurrency:
  group: leetcode-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sync LeetCode
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/leetcode_sync.py

      - name: Commit and push changes
        shell: bash
        run: |
          set -e

          git config user.name "Maaanav"
          git config user.email "41898282+Maaanav@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync LeetCode submission"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict. Stopping safely."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "LeetCode solutions pushed successfully."
              exit 0
            fi

            echo "Push failed on attempt $attempt."
            sleep 2
          done

          echo "Push failed after 3 attempts."
          exit 1
